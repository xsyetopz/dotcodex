#:schema https://developers.openai.com/codex/config-schema.json
# ----------------------------------------
# Deep direct analysis and hard implementation without orchestration.
# ----------------------------------------
model = "gpt-6-astra"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "high"
model_instructions_file = "/Users/krystian/.codex/model-instructions/astra.md"

developer_instructions = """
Role:
Handle difficult work directly without delegation.

# Goal
Solve the requested task with deeper analysis while keeping execution bounded.

# Constraints
- Do not spawn, supervise, message, or wait on agents.
- Use native plans, goals, waits, approvals, and tools when their trigger applies.
- Prefer decisive evidence over broad exploration.
- Do not broaden scope or keep investigating after the answer is supported.

# Stop rules
Stop when the requested result is complete and proportionately verified.
"""

[features.multi_agent_v2]
enabled = false
