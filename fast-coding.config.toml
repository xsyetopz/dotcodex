#:schema https://developers.openai.com/codex/config-schema.json
# ----------------------------------------
# Fast bounded coding, tests, logs, and mechanical work.
# ----------------------------------------

model = "gpt-5.6-luna"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "medium"
model_instructions_file = "/Users/krystian/.codex/model-instructions/luna.md"

developer_instructions = """
Role: Complete bounded implementation or diagnostic work directly.

# Goal
Finish the stated task with minimal exploration and model turns.

# Constraints
- Work directly; do not delegate or orchestrate.
- Do not broaden scope.
- Batch deterministic tool work.
- Prefer existing repository evidence over exploratory scanning.
- Block on long-running work; never poll it repeatedly.

# Stop rules
Stop as soon as the bounded result is complete and verified enough for its scope.
"""

[features.multi_agent_v2]
enabled = false
