#:schema https://developers.openai.com/codex/config-schema.json
# ----------------------------------------
# Default root coordinator.
# ----------------------------------------

model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
approvals_reviewer = "user"
model_verbosity = "low"
model_reasoning_summary = "none"

# Standard service fallback. In 0.154.0 fast_mode=false omits every tier,
# including flex; "default" is the explicit standard-routing sentinel.
service_tier = "default"

# Let long-running commands wait instead of encouraging short polling.
background_terminal_max_timeout = 1500000
tool_output_token_limit = 4000

# No app prompt baggage.
include_apps_instructions = false
include_collaboration_mode_instructions = true

# Native Codex owns tool and collaboration-mode contracts. This policy supplies
# only the local execution stance.
developer_instructions = """
Treat the current request and higher-priority instructions as the authority and scope.
Make the smallest complete change. Inspect simple causes and existing functionality before adding
infrastructure or asking for input. Use a short checklist for work with multiple meaningful slices.
For behavior-neutral typos, inspect the diff; add no tests or unrelated checks. For behavior changes,
run the narrowest meaningful verification and required repository checks. Expand only when evidence
warrants it. Change approach when a probe stops producing useful evidence; block instead of polling.
Finish authorized work without repeatedly asking to continue. Write readable code and plain sentences;
concision must preserve necessary meaning. Report completed changes, actual checks, and precise blockers.

For substantial ongoing work, update private semantic notes at meaningful milestones with
bun --no-env-file --no-install "${CODEX_HOME:-$HOME/.codex}/hooks/compact_checkpoint.mjs" notes
using JSON on stdin: objective, constraints, completed, verification, failed_approaches, blockers,
next_action (all strings; use "unknown" for missing evidence). Run from the session working directory.
Hooks preserve these notes without model calls. The current request and supplied implementation plan
remain authoritative after context recovery; historical handoffs never authorize automatic continuation.
"""

# Keep the execution checklist available in Default mode. Plan mode rejects it
# independently and uses `<proposed_plan>` blocks instead.
[tools.update_plan]
enabled = true

# Keep bundled skills available, then curate the system set explicitly.
[skills]
include_instructions = true

[skills.bundled]
enabled = true

[[skills.config]]
name = "openai-docs"
enabled = true

[[skills.config]]
name = "skill-creator"
enabled = true

[[skills.config]]
name = "imagegen"
enabled = false

[[skills.config]]
name = "plugin-creator"
enabled = false

[[skills.config]]
name = "skill-installer"
enabled = false

[[skills.config]]
name = "review-agent"
enabled = false

[[skills.config]]
name = "find-skills"
enabled = false

# Keep V1 off. V2 below is the only orchestration backend.
[agents]
enabled = false

[agents.scout]
description = "Read-only repository mapping, symbols, call paths, impact, and evidence."
config_file = "agents/scout.toml"

[agents.docs_researcher]
description = "Current external documentation/API research with concise source-backed findings."
config_file = "agents/docs-researcher.toml"

[agents.implementer]
description = "Bounded implementation, refactoring, migrations, and multi-file changes."
config_file = "agents/implementer.toml"

[agents.debugger]
description = "Reproduction, root-cause isolation, and corrective implementation."
config_file = "agents/debugger.toml"

[agents.reviewer]
description = "Read-only second opinion on concrete correctness risks."
config_file = "agents/reviewer.toml"

[agents.cyber_defender]
description = "Authorized defensive cybersecurity analysis using Daybreak Blue."
config_file = "agents/cyber-defender.toml"


[features]
# Preserve repository line-ending conventions when patching.
apply_patch_preserve_line_endings = true

apps = false
computer_use = false

# Makes native `request_user_input` available in Default mode. Without it, availability depends on collaboration mode.
default_mode_request_user_input = true

enable_mcp_apps = false
fast_mode = false
goals = true
hooks = true
image_generation = false

# Suppress the bundled personality layer.
personality = false

plugins = false
plugin_hooks = false
plugin_sharing = false
prevent_idle_sleep = true
remote_plugin = false
recommended_plugins = false

unbounded_connection_retries = false
unified_exec = true
view_image = true
worktrees = true

[features.multi_agent_v2]
enabled = true

# The count includes the root: one worker plus one reviewer/debugger at most.
max_concurrent_threads_per_session = 3

# One long blocking wait rather than repeated model turns.
min_wait_timeout_ms = 1500000
default_wait_timeout_ms = 1500000
max_wait_timeout_ms = 1500000
wait_agent_enabled = true

# Named roles own model selection.
expose_spawn_agent_model_overrides = false
hide_spawn_agent_metadata = false

root_agent_usage_hint_text = """
Direct execution is normal. Optional delegation is authorized for substantial, independent work.
Use at most one worker plus one independently justified reviewer or debugger. Give bounded ownership,
preserve others' edits, and do not duplicate the worker's task. Continue independent work, then block
once when the result is needed. The root integrates and verifies. Use named roles and fresh context;
do not override role models or reasoning. Nested spawning is blocked.
"""

subagent_usage_hint_text = """
Complete the delegated bounded task directly. Do not broaden scope or spawn other agents. Return when
the requested result and proportionate verification are complete.
"""

# Make the suspension primitive available even when the model would not
# normally receive it.
[features.sleep_tool]
enabled = true
mode = "always_on"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

# --- Headroom MCP server ---
[mcp_servers.headroom]
command = "/Users/krystian/.local/bin/headroom"
args = ["mcp", "serve"]
# --- end Headroom MCP server ---

