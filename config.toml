#:schema https://developers.openai.com/codex/config-schema.json
# ----------------------------------------
# Default root coordinator.
# ----------------------------------------

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
model_verbosity = "low"
model_reasoning_summary = "none"

# Replace the bundled base prompt with the curated 0.154.0 CLI contract.
model_instructions_file = "/Users/krystian/.codex/model-instructions.md"

# Let long-running commands wait instead of encouraging short polling.
background_terminal_max_timeout = 1500000

# No app prompt baggage.
include_apps_instructions = false

# Suite-specific delta only; universal engineering behavior lives in model-instructions.md.
developer_instructions = """
Role: Coordinate the task and own final integration.

# Goal
Coordinate authorized delegation and own final integration.

# Constraints
- Delegate only when the user, an applicable AGENTS.md, or an active skill explicitly authorizes it.
- Use at most two direct workers, and only for substantial independent work that replaces root work.
- Give workers complete fresh-context assignments.
- Do not duplicate delegated work.
- Use named roles; do not override worker model or effort.
- `gpt-6-astra` is worker-only; never use it for coordination or supervision.
- Never recursively delegate.
- Never repeatedly poll workers or background processes.
- Continue unrelated root work while workers run. When a result becomes necessary, use one blocking
  wait without a timeout override.
- For external waits, use blocking/sleep primitives instead of status loops.
- Batch independent deterministic tool calls when possible.
- After compaction, continue the active task from retained state and repository evidence.

# Stop rules
Stop when the requested outcome is integrated and proportionately verified.
"""

# Keep bundled skills available, then curate the system set explicitly.
[skills]
include_instructions = true

[skills.bundled]
enabled = true

[[skills.config]]
name = "openai-docs"
enabled = true

[[skills.config]]
name = "skill-creator"
enabled = true

[[skills.config]]
name = "imagegen"
enabled = false

[[skills.config]]
name = "plugin-creator"
enabled = false

[[skills.config]]
name = "skill-installer"
enabled = false

[[skills.config]]
name = "review-agent"
enabled = false

[[skills.config]]
name = "find-skills"
enabled = false

# Keep V1 off. V2 below is the only orchestration backend.
[agents]
enabled = false

[agents.scout]
description = "Cheap read-only repository mapping, symbols, call paths, impact, and evidence."
config_file = "agents/scout.toml"

[agents.docs_researcher]
description = "Current external documentation/API research with concise source-backed findings."
config_file = "agents/docs-researcher.toml"

[agents.implementer_fast]
description = "Straightforward bounded implementation with explicit acceptance criteria."
config_file = "agents/implementer-fast.toml"

[agents.implementer]
description = "Normal implementation, refactoring, migrations, and multi-file changes."
config_file = "agents/implementer.toml"

[agents.debugger]
description = "Difficult debugging, failure isolation, and corrective implementation."
config_file = "agents/debugger.toml"

[agents.test_engineer]
description = "Focused test design, regression coverage, and verification."
config_file = "agents/test-engineer.toml"

[agents.ui_engineer]
description = "Frontend/UI implementation and behavior-focused interface work."
config_file = "agents/ui-engineer.toml"

[agents.reviewer]
description = "Independent correctness, regression, security, and maintainability review."
config_file = "agents/reviewer.toml"

[agents.architect]
description = "Hard bounded architecture, performance, and root-cause analysis using Astra Low."
config_file = "agents/architect.toml"

[agents.hard_debugger]
description = "Exceptional bounded root-cause analysis using Astra Medium."
config_file = "agents/hard-debugger.toml"

[agents.cyber_defender]
description = "Authorized defensive cybersecurity analysis using Daybreak Blue."
config_file = "agents/cyber-defender.toml"

[agents.reverse_engineer]
description = "Authorized reverse engineering of binaries, protocols, formats, and behavior using Daybreak Blue."
config_file = "agents/reverse-engineer.toml"

[agents.log_analyst]
description = "Large logs, traces, JSON, and tool-output reduction; uses Headroom when available."
config_file = "agents/log-analyst.toml"

[features]
# Preserve repository line-ending conventions when patching.
apply_patch_preserve_line_endings = true

apps = false
computer_use = false

# Makes native `request_user_input` available in Default mode. Without it, availability depends on collaboration mode.
default_mode_request_user_input = true

enable_mcp_apps = false
fast_mode = false
image_generation = false

# `model-instructions.md` owns personality.
personality = false

plugins = false
plugin_hooks = false
plugin_sharing = false
prevent_idle_sleep = true
remote_plugin = false
recommended_plugins = false

# Manual skill selection; don't run shadow skill search.
skill_search = false

unbounded_connection_retries = false
worktrees = true

[features.multi_agent_v2]
enabled = true

# This count includes the root, so three slots enforce at most two direct workers.
max_concurrent_threads_per_session = 3

# Root + two workers. One long blocking wait rather than repeated model turns.
min_wait_timeout_ms = 1500000
default_wait_timeout_ms = 1500000
max_wait_timeout_ms = 1500000
wait_agent_enabled = true

# Named roles own model selection.
expose_spawn_agent_model_overrides = false
hide_spawn_agent_metadata = false

root_agent_usage_hint_text = """
Use named roles only when delegation is explicitly authorized and replaces coordinator work. Give
each child a complete fresh-context brief. Continue independent root work while children run, then
block once when a result becomes necessary. Nested spawning is blocked and every accepted spawn is
rewritten to `fork_turns="none"`.
"""

subagent_usage_hint_text = """
Complete the delegated bounded task directly. Do not broaden scope or spawn other agents. Return when
the requested result and proportionate verification are complete.
"""

# Make the suspension primitive available even when the model would not
# normally receive it.
[features.sleep_tool]
enabled = true
mode = "always_on"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

# --- Headroom MCP server ---
[mcp_servers.headroom]
command = "/Users/krystian/.local/bin/headroom"
args = ["mcp", "serve"]
# --- end Headroom MCP server ---

